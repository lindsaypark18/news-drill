<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily News Drill</title>
<meta name="description" content="A daily English drill: one 5–10 minute news segment, a sentence-by-sentence script to memorize, and its rarer vocabulary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: studio desk — player on the left (sticky on wide screens), script on the right; drill and word bank below */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#152030; --muted:#5A6779; --line:#DCE1E8;
  --accent:#B8670A; --accent-soft:#FBEBD5; --ok:#2F7D4F; --ok-soft:#DDF0E3;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141C; --surface:#161E29; --fg:#E4EAF1; --muted:#93A0B2; --line:#263142;
  --accent:#F0A640; --accent-soft:#3A2A12; --ok:#6CC58F; --ok-soft:#173326; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;font-weight:700}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.desk{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media (min-width:980px){.desk{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.watch{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.watch{padding:14px;display:flex;flex-direction:column;gap:14px}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.onair{background:var(--accent);color:var(--surface);padding:2px 8px;border-radius:3px;font-weight:500;letter-spacing:.08em}
.watch h1{font-size:clamp(22px,3.4vw,29px);line-height:1.15}
.watch p{margin:0;max-width:65ch}
.cc{font-size:13px;color:var(--muted)}
.cc a,.script a{color:var(--accent)}
.script{display:flex;flex-direction:column}
.script-head{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs,.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.sents{list-style:none;margin:0;padding:6px 0;counter-reset:s}
.sent{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;align-items:start;counter-increment:s}
.sent::before{content:counter(s);font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.sent.speaker{display:block;padding:14px 16px 2px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);counter-increment:none}
.sent.speaker::before{content:none}
.txt{font-family:var(--display);font-size:18px;line-height:1.5;min-width:0}
.txt b{font-weight:500;background:var(--accent-soft);border-radius:3px;padding:0 2px}
.hint{display:none;font-family:var(--mono);font-size:14px;letter-spacing:.02em;color:var(--muted);cursor:pointer;line-height:1.7;min-width:0;word-break:break-word}
.mem .sent:not(.speaker):not(.shown) .txt{display:none}
.mem .sent:not(.speaker):not(.shown) .hint{display:block}
.tick{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.sent.got{background:var(--ok-soft)}
.sent.got .tick{border-color:var(--ok);color:var(--ok)}
.paste{display:flex;flex-direction:column;gap:10px;padding:16px}
textarea{font:inherit;font-size:14px;width:100%;min-height:200px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);resize:vertical}
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent)}
.section{display:flex;flex-direction:column;gap:12px;max-width:820px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:22px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.steps li:first-child{border-top:0}
.box{width:22px;height:22px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-size:13px;color:var(--surface);margin-top:1px}
.steps li.done .box{background:var(--ok);border-color:var(--ok)}
.steps li.done .st b{color:var(--muted);text-decoration:line-through}
.st b{font-weight:600}
.st span{display:block;font-size:13px;color:var(--muted)}
.words{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.word{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word.known{background:var(--ok-soft)}
.w-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.w-term{font-family:var(--display);font-size:21px;font-weight:700}
.w-ipa,.w-pos{font-family:var(--mono);font-size:12px;color:var(--muted)}
.w-body{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}
.w-def{margin:0}
.w-zh{color:var(--accent);font-weight:500}
.w-ctx,.w-ex{margin:0;font-size:14px;color:var(--muted);max-width:68ch}
.w-ex{color:var(--fg);border-left:2px solid var(--accent);padding-left:10px}
.mark{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;align-self:start;white-space:nowrap}
.word.known .mark{border-color:var(--ok);color:var(--ok)}
.say{font:inherit;font-size:12px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.quiz .w-body{display:none}
.quiz .word.revealed .w-body{display:flex}
.reveal{display:none;font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:left;grid-column:1/-1}
.quiz .word:not(.revealed) .reveal{display:block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 22px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);max-width:70ch;margin:0}
button:focus-visible,select:focus-visible,a:focus-visible,li:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Daily News Drill<small>Watch · memorize sentence by sentence · learn the words</small></div>
    <label><span class="lbl">Lesson</span><select id="pick" aria-label="Choose a lesson"><option>Loading…</option></select></label>
  </header>
  <main id="main"><div class="empty">Loading today's lesson…</div></main>
  <p class="foot">Video comes from the publisher's own player. The study brief, definitions and example sentences are written for this drill. A transcript you paste, and all your progress, stay in this browser only.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS=[
 ["Watch once, just for the story","No pausing. Get the gist."],
 ["Read the script beside the video","Check every highlighted word in the word bank below."],
 ["Shadow it, one sentence at a time","Say each sentence aloud, matching rhythm and stress."],
 ["Memorize the script","Switch to Memorize. Recite each sentence from its first letters, then tap to check."],
 ["Quiz yourself on the words","Switch the word bank to Quiz and recall each meaning before revealing."],
 ["Use three words today","Drop them into an email, a slide or a meeting on purpose."]
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=Object.assign({known:{},steps:{},got:{},quiz:false,mem:false,src:"brief"},store.get("ndd",{}));
P.got=P.got||{};
const save=()=>store.set("ndd",P);
let index=[],L=null,usePbs=false,editing=false;
const fmt=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}catch(e){return d}};

function playerSrc(l){
  if(l.youtubeId&&!(usePbs&&l.pbsPlayerId)) return "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(l.youtubeId)+"?cc_lang_pref=en&hl=en&rel=0";
  if(l.pbsPlayerId) return "https://player.pbs.org/viralplayer/"+encodeURIComponent(l.pbsPlayerId)+"/";
  return "";
}
/* split pasted transcript into speaker labels and sentences */
function parseTranscript(raw){
  const out=[];
  raw.replace(/\r/g,"").replace(/\*\*/g,"").split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    if(/^(notice:|read the full transcript)/i.test(line)) return;
    if(/^\(.*\)$/.test(line)) return;
    let m=line.match(/^([A-Z][^:.!?]{1,90}):\s*(.*)$/);
    if(m&&m[1].split(/\s+/).length<=12){out.push({speaker:m[1].replace(/\*/g,"").trim()});line=m[2];if(!line)return}
    const parts=line.split(/(?<=[.!?]["”’)]?)\s+(?=["“(]?[A-Z0-9])/),merged=[];
    parts.forEach(s=>{s=s.trim();if(!s)return;const prev=merged[merged.length-1];
      if(prev&&/(?:\b(?:Mr|Mrs|Ms|Dr|St|Jr|Sr|Gen|Sen|Rep|Gov|Lt|Col|Prof|vs)\.|\b(?:[A-Z]\.){1,3})$/.test(prev)) merged[merged.length-1]=prev+" "+s; else merged.push(s)});
    merged.forEach(s=>out.push({text:s}));
  });
  return out;
}
function terms(){return [...(L.vocab||[]).map(v=>v.word),...(L.phrases||[]).map(v=>v.phrase)].filter(Boolean)}
function highlight(s){
  let h=esc(s);
  terms().forEach(t=>{
    const words=t.split(/\s+/).filter(w=>!/^(someone|something|sb|sth)$/i.test(w));
    if(!words.length) return;
    const pat=words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/(e|y)$/i,"")+"[a-z]*").join("\\s+(?:\\w+\\s+)?");
    try{h=h.replace(new RegExp("\\b("+pat+")\\b","gi"),"<b>$1</b>")}catch(e){}
  });
  return h;
}
const hintOf=s=>s.split(/\s+/).map(w=>w.replace(/([A-Za-z0-9])[A-Za-z0-9'’-]*/,"$1_")).join(" ");
function scriptItems(){
  if(P.src==="brief") return (L.brief||[]).map(t=>({text:t}));
  const raw=store.get("tx-"+L.date,""); return raw?parseTranscript(raw):[];
}
function scriptHTML(){
  const items=scriptItems(),gk=L.date+":"+P.src,got=new Set(P.got[gk]||[]);
  const n=items.filter(i=>i.text).length,g=[...got].filter(i=>i<n).length;
  const head=`<div class="script-head">
    <div class="row"><div class="tabs"><button class="chip" data-src="brief" aria-pressed="${P.src==="brief"}">Study brief</button><button class="chip" data-src="tx" aria-pressed="${P.src==="tx"}">Official transcript</button></div>
    ${n?`<span class="count">${g}/${n} memorized</span>`:""}</div>
    ${n&&!(P.src==="tx"&&editing)?`<div class="row"><div class="toolbar"><button class="chip" data-mem="0" aria-pressed="${!P.mem}">Read</button><button class="chip" data-mem="1" aria-pressed="${P.mem}">Memorize</button></div>${P.src==="tx"?`<a href="#" data-edit>Replace transcript</a>`:""}</div>`:""}
    ${P.src==="brief"?`<p class="note">An account of the story written for you, using today's words. Highlighted terms are in the word bank.</p>`:""}
  </div>`;
  if(P.src==="tx"&&(!n||editing)){
    return head+`<div class="paste"><p class="note">Open the <a href="${esc(L.url)}#transcript" target="_blank" rel="noopener">transcript on the PBS page</a>, copy it from the first speaker to the last line, and paste it here. The site splits it into sentences for you. It stays in this browser only.</p>
    <textarea id="tx" aria-label="Paste the transcript" placeholder="Paste the transcript here…">${esc(store.get("tx-"+L.date,""))}</textarea>
    <div class="toolbar"><button class="btn" data-savetx>Split into sentences</button>${n?`<button class="btn ghost" data-cancel>Cancel</button>`:""}</div></div>`;
  }
  if(!n) return head+`<div class="paste"><p class="note">No study brief for this lesson.</p></div>`;
  let i=-1;
  return head+`<ol class="sents${P.mem?" mem":""}">${items.map(it=>{
    if(it.speaker) return `<li class="sent speaker">${esc(it.speaker)}</li>`;
    i++; const ok=got.has(i);
    return `<li class="sent${ok?" got":""}" data-i="${i}"><span class="txt">${highlight(it.text)}</span><span class="hint" data-show title="Tap to check">${esc(hintOf(it.text))}</span><button class="tick" data-got="${i}">${ok?"✓ Got it":"Got it"}</button></li>`;
  }).join("")}</ol>`;
}
function item(v,phrase){
  const term=phrase?v.phrase:v.word,k=term.toLowerCase(),known=!!P.known[k];
  return `<div class="word${known?" known":""}">
   <div class="w-head"><span class="w-term">${esc(term)}</span>${v.ipa?`<span class="w-ipa">${esc(v.ipa)}</span>`:""}<span class="w-pos">${esc(v.pos||"")}</span><button class="say" data-say="${esc(term)}" aria-label="Hear ${esc(term)}">🔊 Hear it</button></div>
   <button class="mark" data-key="${esc(k)}">${known?"✓ Known":"Mark known"}</button>
   <button class="reveal">Recall the meaning, then tap to check</button>
   <div class="w-body"><p class="w-def">${esc(v.meaning)} <span class="w-zh">${esc(v.zh)}</span></p>
   ${v.context?`<p class="w-ctx"><span class="lbl">In the segment</span>${esc(v.context)}</p>`:""}
   ${v.example?`<p class="w-ex"><span class="lbl">At work</span>${esc(v.example)}</p>`:""}</div></div>`;
}
function renderScript(){const el=$("#script");if(el)el.innerHTML=scriptHTML()}
function render(){
  $("#pick").innerHTML=index.map(l=>`<option value="${esc(l.date)}"${L&&L.date===l.date?" selected":""}>${esc(fmt(l.date))} — ${esc(l.title).slice(0,48)}</option>`).join("")||"<option>No lessons yet</option>";
  if(!L) return;
  const done=new Set(P.steps[L.date]||[]),all=[...(L.vocab||[]),...(L.phrases||[])];
  const kc=all.filter(v=>P.known[(v.word||v.phrase).toLowerCase()]).length,src=playerSrc(L);
  $("#main").innerHTML=`<div style="display:flex;flex-direction:column;gap:32px">
   <div class="desk">
    <article class="panel watch">
     ${src?`<div class="player"><iframe src="${esc(src)}" title="${esc(L.title)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`:""}
     <div class="meta"><span class="onair">${esc(L.show||"PBS NEWS HOUR")}</span><span>${esc(fmt(L.date))}</span><span>${esc(L.duration||"")}</span>${L.topic?`<span>${esc(L.topic)}</span>`:""}</div>
     <h1>${esc(L.title)}</h1>
     <p>${esc(L.summary)}</p>
     <p class="cc">Video not loading? ${L.youtubeId&&L.pbsPlayerId?`<a href="#" data-swap>${usePbs?"Switch back to YouTube":"Try the PBS player"}</a> or `:""}<a href="${esc(L.url)}" target="_blank" rel="noopener">watch on PBS</a>.</p>
    </article>
    <section class="panel script" id="script" aria-label="Script">${scriptHTML()}</section>
   </div>
   <section class="section">
    <div class="section-head"><h2>Today's drill</h2><span class="count">${done.size}/${STEPS.length} done</span></div>
    <ol class="steps">${STEPS.map((s,i)=>`<li class="${done.has(i)?"done":""}" data-step="${i}" tabindex="0" role="checkbox" aria-checked="${done.has(i)}"><span class="box">${done.has(i)?"✓":""}</span><span class="st"><b>${esc(s[0])}</b><span>${esc(i===2&&L.focus?L.focus:s[1])}</span></span></li>`).join("")}</ol>
   </section>
   <section class="section${P.quiz?" quiz":""}">
    <div class="section-head"><h2>Word bank</h2><span class="count">${kc}/${all.length} known</span></div>
    <div class="toolbar"><button class="chip" data-mode="study" aria-pressed="${!P.quiz}">Study</button><button class="chip" data-mode="quiz" aria-pressed="${P.quiz}">Quiz</button></div>
    <div class="words">${(L.vocab||[]).map(v=>item(v,false)).join("")}</div>
    ${(L.phrases||[]).length?`<div class="section-head"><h2>Phrases to steal</h2></div><div class="words">${L.phrases.map(v=>item(v,true)).join("")}</div>`:""}
   </section></div>`;
}
function toggleStep(i){const s=new Set(P.steps[L.date]||[]);s.has(i)?s.delete(i):s.add(i);P.steps[L.date]=[...s];save();render()}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-swap]")){e.preventDefault();usePbs=!usePbs;render();return}
  const src=t.closest("[data-src]"); if(src){P.src=src.dataset.src;editing=false;save();renderScript();return}
  const mem=t.closest("[data-mem]"); if(mem){P.mem=mem.dataset.mem==="1";save();renderScript();return}
  if(t.closest("[data-show]")){t.closest(".sent").classList.add("shown");return}
  const g=t.closest("[data-got]"); if(g){const k=L.date+":"+P.src,s=new Set(P.got[k]||[]),i=+g.dataset.got;s.has(i)?s.delete(i):s.add(i);P.got[k]=[...s];save();renderScript();return}
  if(t.closest("[data-edit]")){e.preventDefault();editing=true;renderScript();return}
  if(t.closest("[data-cancel]")){editing=false;renderScript();return}
  if(t.closest("[data-savetx]")){const v=$("#tx").value.trim();store.set("tx-"+L.date,v);P.got[L.date+":tx"]=[];save();editing=false;renderScript();return}
  const li=t.closest(".steps li"); if(li){toggleStep(+li.dataset.step);return}
  const m=t.closest(".mark"); if(m){const k=m.dataset.key;P.known[k]?delete P.known[k]:P.known[k]=true;save();render();return}
  const r=t.closest(".reveal"); if(r){r.closest(".word").classList.add("revealed");return}
  const c=t.closest("[data-mode]"); if(c){P.quiz=c.dataset.mode==="quiz";save();render();return}
  const s=t.closest(".say"); if(s&&"speechSynthesis" in window){const u=new SpeechSynthesisUtterance(s.dataset.say);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
});
document.addEventListener("keydown",e=>{const li=e.target.closest?.(".steps li");if(li&&(e.key===" "||e.key==="Enter")){e.preventDefault();toggleStep(+li.dataset.step)}});
async function load(date){
  try{const r=await fetch("lessons/"+date+".json",{cache:"no-cache"});L=await r.json();editing=false;render();scrollTo(0,0)}
  catch(e){$("#main").innerHTML=`<div class="empty">Couldn't load this lesson. Check your connection and reload.</div>`}
}
$("#pick").addEventListener("change",e=>load(e.target.value));
(async()=>{
  try{const r=await fetch("lessons/index.json",{cache:"no-cache"});index=(await r.json()).sort((a,b)=>b.date.localeCompare(a.date))}
  catch(e){$("#main").innerHTML=`<div class="empty">Couldn't load lessons. Check your connection and reload.</div>`;return}
  if(!index.length){$("#main").innerHTML=`<div class="empty">No lessons yet. The first one arrives on the next weekday morning.</div>`;render();return}
  load(index[0].date);
})();
</script>
</body>
</html>
