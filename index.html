<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily News Drill</title>
<meta name="description" content="A daily English shadowing drill: one 5–10 minute news video with captions, sentence looping, slow playback and its rarer vocabulary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: studio desk — player and shadowing console on the left (sticky on wide screens), study brief on the right; drill and word bank below */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#152030; --muted:#5A6779; --line:#DCE1E8;
  --accent:#B8670A; --accent-soft:#FBEBD5; --ok:#2F7D4F; --ok-soft:#DDF0E3; --loop:#1F5FA8; --loop-soft:#DFEAF8;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E141C; --surface:#161E29; --fg:#E4EAF1; --muted:#93A0B2; --line:#263142;
  --accent:#F0A640; --accent-soft:#3A2A12; --ok:#6CC58F; --ok-soft:#173326; --loop:#7DB2F0; --loop-soft:#16263B; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;font-weight:700}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);max-width:100%}
.desk{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media (min-width:980px){.desk{grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr)}.watch{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.watch{padding:14px;display:flex;flex-direction:column;gap:12px}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.player iframe,.player>div{position:absolute;inset:0;width:100%;height:100%;border:0}
/* shadowing console */
.console{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cbtn{font:inherit;font-size:13px;font-weight:600;min-height:36px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.cbtn:disabled{opacity:.45;cursor:not-allowed}
.cbtn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);min-width:84px;justify-content:center}
.cbtn.on{background:var(--loop);color:var(--surface);border-color:var(--loop)}
.cbtn kbd{font-family:var(--mono);font-size:10px;font-weight:500;color:inherit;opacity:.65;border:1px solid currentColor;border-radius:3px;padding:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-family:var(--mono);min-height:34px;padding:4px 10px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.time{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.loopbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;background:var(--loop-soft);font-size:13px}
.loopbar .state{font-family:var(--mono);font-size:12px;color:var(--loop);font-variant-numeric:tabular-nums}
.loopbar .grow{flex:1 1 140px;color:var(--muted)}
label.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.keys{font-size:12px;color:var(--muted);margin:0}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--surface)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.onair{background:var(--accent);color:var(--surface);padding:2px 8px;border-radius:3px;font-weight:500;letter-spacing:.08em}
.watch h1{font-size:clamp(22px,3.4vw,29px);line-height:1.15}
.watch p{margin:0;max-width:65ch}
.cc{font-size:13px;color:var(--muted)}
.cc a{color:var(--accent)}
.go{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.gobtn{display:inline-flex;align-items:center;font-weight:600;font-size:14px;padding:10px 16px;border-radius:7px;background:var(--accent);color:var(--surface);text-decoration:none}
.gobtn:hover{filter:brightness(1.08)}
.script{display:flex;flex-direction:column}
.script-head{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.script-head h2{font-size:21px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:0}
.sents{list-style:none;margin:0;padding:6px 0;counter-reset:s}
.sent{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;align-items:start;counter-increment:s}
.sent::before{content:counter(s);font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:5px;font-variant-numeric:tabular-nums}
.txt{font-family:var(--display);font-size:18px;line-height:1.5;min-width:0}
.txt b{font-weight:500;background:var(--accent-soft);border-radius:3px;padding:0 2px}
.hint{display:none;font-family:var(--mono);font-size:14px;color:var(--muted);cursor:pointer;line-height:1.7;min-width:0;word-break:break-word}
.mem .sent:not(.shown) .txt{display:none}
.mem .sent:not(.shown) .hint{display:block}
.tick{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.sent.got{background:var(--ok-soft)}
.sent.got .tick{border-color:var(--ok);color:var(--ok)}
.section{display:flex;flex-direction:column;gap:12px;max-width:820px}
.side{display:flex;flex-direction:column;gap:12px;padding:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:22px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.steps li:first-child{border-top:0}
.box{width:22px;height:22px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-size:13px;color:var(--surface);margin-top:1px}
.steps li.done .box{background:var(--ok);border-color:var(--ok)}
.steps li.done .st b{color:var(--muted);text-decoration:line-through}
.st b{font-weight:600}
.st span{display:block;font-size:13px;color:var(--muted)}
.words{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.word{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:16px;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word.known{background:var(--ok-soft)}
.w-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.w-term{font-family:var(--display);font-size:21px;font-weight:700}
.w-ipa,.w-pos{font-family:var(--mono);font-size:12px;color:var(--muted)}
.w-body{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;min-width:0}
.w-def{margin:0}
.w-zh{color:var(--accent);font-weight:500}
.w-ctx,.w-ex{margin:0;font-size:14px;color:var(--muted);max-width:68ch}
.w-ex{color:var(--fg);border-left:2px solid var(--accent);padding-left:10px}
.mark{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;align-self:start;white-space:nowrap}
.word.known .mark{border-color:var(--ok);color:var(--ok)}
.say{font:inherit;font-size:12px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.quiz .w-body{display:none}
.quiz .word.revealed .w-body{display:flex}
.reveal{display:none;font:inherit;font-size:13px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-align:left;grid-column:1/-1}
.quiz .word:not(.revealed) .reveal{display:block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px 22px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);max-width:70ch;margin:0}
button:focus-visible,select:focus-visible,a:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.time{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Daily News Drill<small>Listen · shadow sentence by sentence · learn the words</small></div>
    <label><span class="lbl">Lesson</span><select id="pick" aria-label="Choose a lesson"><option>Loading…</option></select></label>
  </header>
  <main id="main"><div class="empty">Loading today's lesson…</div></main>
  <p class="foot">Videos play in the publisher's own YouTube player, captions included. Definitions and example sentences are written for this drill. Your progress is saved in this browser.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STEPS=[
 ["Watch once at full speed","Captions on. Just follow the story."],
 ["Check the words","Go through the word bank on the right so nothing surprises you."],
 ["Shadow at 0.75×, one sentence at a time","Tap A at the start of a sentence and B at the end. Repeat with the anchor until your stress and rhythm match, then tap Next."],
 ["Shadow again at 1×","Same sentences, full speed. Try it with captions off."],
 ["Recite one passage from memory","Pick a 30-second stretch, turn captions off, and say it along with the anchor."],
 ["Use three words today","Drop them into an email, a slide or a meeting on purpose."]
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=Object.assign({known:{},steps:{},got:{},quiz:false,mem:false,rate:1,gap:false},store.get("ndd",{}));
P.got=P.got||{};
const save=()=>store.set("ndd",P);
let index=[],L=null,usePbs=false;
const fmt=d=>{try{return new Date(String(d).slice(0,10)+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}catch(e){return d}};
const clock=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0")};

/* ---------- YouTube shadowing player ---------- */
const S={yt:null,ready:false,playing:false,a:null,b:null,cc:true,pausedForGap:false,gapTimer:null};
let ytApi=null;
function loadYT(){
  if(ytApi) return ytApi;
  ytApi=new Promise((res,rej)=>{
    if(window.YT&&window.YT.Player) return res();
    window.onYouTubeIframeAPIReady=()=>res();
    const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=rej;document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),12000);
  });
  return ytApi;
}
async function mountPlayer(){
  if(S.yt){try{S.yt.destroy()}catch(e){}S.yt=null}
  S.ready=false;S.playing=false;S.a=S.b=null;clearTimeout(S.gapTimer);
  const host=$("#ytmount"); if(!host) return;
  try{await loadYT()}catch(e){showPlayerError();return}
  if(!$("#ytmount")) return;
  S.yt=new YT.Player("ytmount",{
    host:"https://www.youtube-nocookie.com",
    videoId:L.youtubeId,
    playerVars:{cc_load_policy:1,cc_lang_pref:"en",hl:"en",rel:0,playsinline:1,modestbranding:1},
    events:{
      onReady:()=>{S.ready=true;try{S.yt.setPlaybackRate(P.rate)}catch(e){}setCC(S.cc);updateConsole()},
      onStateChange:e=>{S.playing=e.data===1;if(e.data===1)setCC(S.cc);updateConsole()},
      onError:()=>showPlayerError()
    }
  });
}
function showPlayerError(){
  const c=$("#console"); if(c) c.innerHTML=`<p class="note">The video couldn't load here. ${L.pbsPlayerId?`<a href="#" data-swap>Try the PBS player</a> (no shadowing controls) or `:""}<a href="https://www.youtube.com/watch?v=${esc(L.youtubeId)}" target="_blank" rel="noopener">open it on YouTube</a>.</p>`;
}
function setCC(on){
  if(!S.yt||!S.ready) return;
  try{ if(on){S.yt.loadModule("captions");S.yt.setOption("captions","track",{languageCode:"en"})} else {S.yt.unloadModule("captions")} }catch(e){}
}
const now=()=>{try{return S.yt.getCurrentTime()}catch(e){return 0}};
function play(){if(S.ready){clearTimeout(S.gapTimer);S.pausedForGap=false;S.yt.playVideo()}}
function pause(){if(S.ready){clearTimeout(S.gapTimer);S.pausedForGap=false;S.yt.pauseVideo()}}
function toggle(){S.playing||S.pausedForGap?pause():play()}
function back(sec){if(S.ready){S.yt.seekTo(Math.max(0,now()-sec),true)}}
function setRate(r){P.rate=r;save();if(S.ready)try{S.yt.setPlaybackRate(r)}catch(e){}updateConsole()}
function markA(){if(!S.ready)return;S.a=Math.max(0,now()-0.15);if(S.b!==null&&S.b<=S.a+0.3)S.b=null;updateConsole()}
function markB(){if(!S.ready)return;const t=now();if(S.a===null)S.a=Math.max(0,t-5);if(t<=S.a+0.3)return;S.b=t;S.yt.seekTo(S.a,true);play();updateConsole()}
function clearLoop(){S.a=S.b=null;clearTimeout(S.gapTimer);S.pausedForGap=false;updateConsole()}
function nextSentence(){if(S.b===null)return;S.a=S.b;S.b=null;clearTimeout(S.gapTimer);S.pausedForGap=false;if(S.ready){S.yt.seekTo(S.a,true);play()}updateConsole()}
function replayLoop(){if(S.ready&&S.a!==null){S.yt.seekTo(S.a,true);play()}}
setInterval(()=>{
  if(!S.ready) return;
  const t=now(),tEl=$("#ctime"); if(tEl){let d=0;try{d=S.yt.getDuration()}catch(e){}tEl.textContent=clock(t)+" / "+clock(d)}
  if(S.a!==null&&S.b!==null&&S.playing&&t>=S.b){
    if(P.gap){
      S.yt.pauseVideo();S.yt.seekTo(S.a,true);S.pausedForGap=true;
      const wait=Math.min(20000,Math.max(1500,(S.b-S.a)/(P.rate||1)*1000*1.2));
      S.gapTimer=setTimeout(()=>{if(S.pausedForGap){S.pausedForGap=false;S.yt.playVideo()}},wait);
      updateConsole();
    } else S.yt.seekTo(S.a,true);
  }
},120);
function consoleHTML(){
  return `<div class="crow">
    <button class="cbtn" data-c="back" title="Back 3 seconds (←)">⟲ 3s <kbd>←</kbd></button>
    <button class="cbtn primary" data-c="toggle" id="cplay">${S.playing||S.pausedForGap?"❚❚ Pause":"▶ Play"}</button>
    <span class="seg" role="group" aria-label="Speed">${[0.5,0.75,1].map(r=>`<button data-rate="${r}" aria-pressed="${P.rate===r}">${r}×</button>`).join("")}</span>
    <button class="cbtn${S.cc?" on":""}" data-c="cc" aria-pressed="${S.cc}" title="Captions (C)">CC <kbd>C</kbd></button>
    <span class="time" id="ctime">0:00 / 0:00</span>
  </div>
  <div class="loopbar">
    <button class="cbtn${S.a!==null?" on":""}" data-c="a" title="Mark sentence start (A)">A <kbd>A</kbd></button>
    <button class="cbtn${S.b!==null?" on":""}" data-c="b" title="Mark sentence end and loop (B)">B <kbd>B</kbd></button>
    <span class="state">${S.a===null?"No loop":S.b===null?"Start "+clock(S.a)+" · tap B at the end of the sentence":"Looping "+clock(S.a)+"–"+clock(S.b)}</span>
    <span class="grow"></span>
    <button class="cbtn" data-c="next" ${S.b===null?"disabled":""} title="Next sentence (N)">Next → <kbd>N</kbd></button>
    <button class="cbtn" data-c="clear" ${S.a===null?"disabled":""} title="Clear loop (X)">Clear <kbd>X</kbd></button>
    <label class="toggle"><input type="checkbox" id="gap" ${P.gap?"checked":""}> Pause so I can repeat</label>
  </div>`;
}
function updateConsole(){const c=$("#console");if(c&&L&&L.youtubeId&&!usePbs)c.innerHTML=consoleHTML()}
document.addEventListener("keydown",e=>{
  if(!L||!L.youtubeId||usePbs) return;
  if(e.target.closest&&e.target.closest("input,textarea,select")) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase();
  const map={" ":toggle,"k":toggle,"arrowleft":()=>back(3),"a":markA,"b":markB,"n":nextSentence,"x":clearLoop,"r":replayLoop,"c":()=>{S.cc=!S.cc;setCC(S.cc);updateConsole()},"1":()=>setRate(0.5),"2":()=>setRate(0.75),"3":()=>setRate(1)};
  if(map[k]){e.preventDefault();map[k]()}
});

/* ---------- study brief ---------- */
function terms(){return [...(L.vocab||[]).map(v=>v.word),...(L.phrases||[]).map(v=>v.phrase)].filter(Boolean)}
function highlight(s){
  let h=esc(s);
  terms().forEach(t=>{
    const words=t.split(/\s+/).filter(w=>!/^(someone|something|sb|sth)$/i.test(w));
    if(!words.length) return;
    const pat=words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/(e|y)$/i,"")+"[a-z]*").join("\\s+(?:\\w+\\s+)?");
    try{h=h.replace(new RegExp("\\b("+pat+")\\b","gi"),"<b>$1</b>")}catch(e){}
  });
  return h;
}
const hintOf=s=>s.split(/\s+/).map(w=>w.replace(/([A-Za-z0-9])[A-Za-z0-9'’-]*/,"$1_")).join(" ");
function scriptHTML(){
  const items=L.brief||[],got=new Set(P.got[L.date+":brief"]||[]),g=[...got].filter(i=>i<items.length).length;
  if(!items.length) return `<div class="script-head"><h2>Study brief</h2><p class="note">No study brief for this lesson.</p></div>`;
  return `<div class="script-head">
    <div class="row"><h2>Study brief</h2><span class="count">${g}/${items.length} memorized</span></div>
    <p class="note">The story retold for you to memorize, using today's words. For the anchor's exact words, shadow the captions on the left.</p>
    <div class="toolbar"><button class="chip" data-mem="0" aria-pressed="${!P.mem}">Read</button><button class="chip" data-mem="1" aria-pressed="${P.mem}">Memorize</button></div>
  </div>
  <ol class="sents${P.mem?" mem":""}">${items.map((t,i)=>{const ok=got.has(i);
    return `<li class="sent${ok?" got":""}"><span class="txt">${highlight(t)}</span><span class="hint" data-show title="Tap to check">${esc(hintOf(t))}</span><button class="tick" data-got="${i}">${ok?"✓ Got it":"Got it"}</button></li>`}).join("")}</ol>`;
}

/* ---------- drill + word bank ---------- */
function item(v,phrase){
  const term=phrase?v.phrase:v.word,k=term.toLowerCase(),known=!!P.known[k];
  return `<div class="word${known?" known":""}">
   <div class="w-head"><span class="w-term">${esc(term)}</span>${v.ipa?`<span class="w-ipa">${esc(v.ipa)}</span>`:""}<span class="w-pos">${esc(v.pos||"")}</span><button class="say" data-say="${esc(term)}" aria-label="Hear ${esc(term)}">🔊 Hear it</button></div>
   <button class="mark" data-key="${esc(k)}">${known?"✓ Known":"Mark known"}</button>
   <button class="reveal">Recall the meaning, then tap to check</button>
   <div class="w-body"><p class="w-def">${esc(v.meaning)} <span class="w-zh">${esc(v.zh)}</span></p>
   ${v.context?`<p class="w-ctx"><span class="lbl">In the video</span>${esc(v.context)}</p>`:""}
   ${v.example?`<p class="w-ex"><span class="lbl">At work</span>${esc(v.example)}</p>`:""}</div></div>`;
}
function drillHTML(){
  const done=new Set(P.steps[L.date]||[]);
  return `<div class="section-head"><h2>Today's drill</h2><span class="count">${done.size}/${STEPS.length} done</span></div>
    <ol class="steps">${STEPS.map((s,i)=>`<li class="${done.has(i)?"done":""}" data-step="${i}" tabindex="0" role="checkbox" aria-checked="${done.has(i)}"><span class="box">${done.has(i)?"✓":""}</span><span class="st"><b>${esc(s[0])}</b><span>${esc(s[1])}${i===2&&L.focus?" "+esc(L.focus):""}</span></span></li>`).join("")}</ol>`;
}
function bankHTML(){
  const all=[...(L.vocab||[]),...(L.phrases||[])],kc=all.filter(v=>P.known[(v.word||v.phrase).toLowerCase()]).length;
  return `<div class="section-head"><h2>Word bank</h2><span class="count">${kc}/${all.length} known</span></div>
    <div class="toolbar"><button class="chip" data-mode="study" aria-pressed="${!P.quiz}">Study</button><button class="chip" data-mode="quiz" aria-pressed="${P.quiz}">Quiz</button></div>
    <div class="words">${(L.vocab||[]).map(v=>item(v,false)).join("")}</div>
    ${(L.phrases||[]).length?`<div class="section-head"><h2>Phrases to steal</h2></div><div class="words">${L.phrases.map(v=>item(v,true)).join("")}</div>`:""}`;
}
const paint={script:()=>{$("#script").innerHTML=scriptHTML()},drill:()=>{$("#drill").innerHTML=drillHTML()},bank:()=>{const b=$("#bank");b.className="panel side"+(P.quiz?" quiz":"");b.innerHTML=bankHTML()}};

/* ---------- lesson shell (built once per lesson so the player isn't rebuilt) ---------- */
function renderPicker(){
  $("#pick").innerHTML=index.map(l=>`<option value="${esc(l.date)}"${L&&L.date===l.date?" selected":""}>${esc(fmt(l.date))} — ${esc(l.title).slice(0,48)}</option>`).join("")||"<option>No lessons yet</option>";
}
function renderLesson(){
  renderPicker();
  const yt=L.youtubeId&&!usePbs;
  const media=yt?`<div class="player"><div id="ytmount"></div></div><div class="console" id="console">${consoleHTML()}</div>
      <p class="keys">Shortcuts: <kbd>Space</kbd> play/pause · <kbd>←</kbd> back 3s · <kbd>A</kbd>/<kbd>B</kbd> loop a sentence · <kbd>N</kbd> next · <kbd>R</kbd> replay · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> speed</p>`
    : L.pbsPlayerId?`<div class="player"><iframe src="https://player.pbs.org/viralplayer/${esc(L.pbsPlayerId)}/" title="${esc(L.title)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe></div>`:"";
  const alt=L.youtubeId&&L.pbsPlayerId?`<a href="#" data-swap>${usePbs?"Back to the shadowing player":"Try the PBS player"}</a> or `:"";
  $("#main").innerHTML=`<div style="display:flex;flex-direction:column;gap:32px">
   <div class="desk">
    <article class="panel watch">
     ${media}
     <div class="meta"><span class="onair">${esc(L.show||"NEWS")}</span><span>${esc(fmt(L.date))}</span>${L.duration?`<span>${esc(L.duration)}</span>`:""}${L.topic?`<span>${esc(L.topic)}</span>`:""}</div>
     <h1>${esc(L.title)}</h1>
     <p>${esc(L.summary)}</p>
     ${L.youtubeId?`<div class="go"><a class="gobtn" href="https://www.youtube.com/watch?v=${esc(L.youtubeId)}" target="_blank" rel="noopener">Shadow on YouTube with transcript ↗</a><span class="note">On YouTube, click <b>…more</b> under the title, then <b>Show transcript</b>.</span></div>`:""}
     <p class="cc">Video not loading? ${alt}<a href="${esc(L.url)}" target="_blank" rel="noopener">see the source</a>.</p>
    </article>
    <section class="panel side" id="bank" aria-label="Word bank"></section>
   </div>
   <section class="section" id="drill"></section></div>`;
  paint.drill();paint.bank();
  if(yt) mountPlayer();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const c=t.closest("[data-c]"); if(c){const a=c.dataset.c;
    ({back:()=>back(3),toggle,a:markA,b:markB,next:nextSentence,clear:clearLoop,cc:()=>{S.cc=!S.cc;setCC(S.cc);updateConsole()}})[a]?.();return}
  const r=t.closest("[data-rate]"); if(r){setRate(+r.dataset.rate);return}
  if(t.closest("[data-swap]")){e.preventDefault();usePbs=!usePbs;if(usePbs&&S.yt){try{S.yt.destroy()}catch(_){}S.yt=null;S.ready=false}renderLesson();return}
  const mem=t.closest("[data-mem]"); if(mem){P.mem=mem.dataset.mem==="1";save();paint.script();return}
  if(t.closest("[data-show]")){t.closest(".sent").classList.add("shown");return}
  const g=t.closest("[data-got]"); if(g){const k=L.date+":brief",s=new Set(P.got[k]||[]),i=+g.dataset.got;s.has(i)?s.delete(i):s.add(i);P.got[k]=[...s];save();paint.script();return}
  const li=t.closest(".steps li"); if(li){toggleStep(+li.dataset.step);return}
  const m=t.closest(".mark"); if(m){const k=m.dataset.key;P.known[k]?delete P.known[k]:P.known[k]=true;save();paint.bank();return}
  const rv=t.closest(".reveal"); if(rv){rv.closest(".word").classList.add("revealed");return}
  const md=t.closest("[data-mode]"); if(md){P.quiz=md.dataset.mode==="quiz";save();paint.bank();return}
  const sy=t.closest(".say"); if(sy&&"speechSynthesis" in window){const u=new SpeechSynthesisUtterance(sy.dataset.say);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
});
document.addEventListener("change",e=>{if(e.target.id==="gap"){P.gap=e.target.checked;save()}});
document.addEventListener("keydown",e=>{const li=e.target.closest?.(".steps li");if(li&&(e.key==="Enter")){e.preventDefault();toggleStep(+li.dataset.step)}});
function toggleStep(i){const s=new Set(P.steps[L.date]||[]);s.has(i)?s.delete(i):s.add(i);P.steps[L.date]=[...s];save();paint.drill()}
async function load(date){
  try{const r=await fetch("lessons/"+date+".json",{cache:"no-cache"});L=await r.json();usePbs=false;renderLesson();scrollTo(0,0)}
  catch(e){$("#main").innerHTML=`<div class="empty">Couldn't load this lesson. Check your connection and reload.</div>`}
}
$("#pick").addEventListener("change",e=>load(e.target.value));
(async()=>{
  try{const r=await fetch("lessons/index.json",{cache:"no-cache"});index=(await r.json()).sort((a,b)=>b.date.localeCompare(a.date))}
  catch(e){$("#main").innerHTML=`<div class="empty">Couldn't load lessons. Check your connection and reload.</div>`;return}
  if(!index.length){$("#main").innerHTML=`<div class="empty">No lessons yet. The first one arrives on the next weekday morning.</div>`;renderPicker();return}
  load(index[0].date);
})();
</script>
</body>
</html>
